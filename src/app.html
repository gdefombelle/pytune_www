<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Analytics is queued immediately, but its network request waits for idle time. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9MYQQN6Y2G');

    function loadAnalytics() {
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-9MYQQN6Y2G';
      document.head.appendChild(script);
    }

    var analyticsLoaded = false;
    function loadAnalyticsOnce() {
      if (analyticsLoaded) return;
      analyticsLoaded = true;
      loadAnalytics();
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {
        window.removeEventListener(eventName, loadAnalyticsOnce);
      });
    }

    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {
      window.addEventListener(eventName, loadAnalyticsOnce, { passive: true, once: true });
    });
    window.addEventListener('load', function () {
      window.setTimeout(loadAnalyticsOnce, 5000);
    }, { once: true });
  </script>
  <meta charset="utf-8" />

  <!-- Viewport et zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" href="%sveltekit.assets%/favicon.ico" />

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
 
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
